name: telegram-bot

# Reads new Telegram messages (sign-ups from the landing page, /status, /stop) every few minutes.
# GitHub may delay scheduled runs, so a reply can take 5-20 minutes.
on:
  schedule:
    - cron: "3-58/5 * * * *"   # every 5 minutes, off the busy :00 minute
  workflow_dispatch:
    inputs:
      owner_code:
        description: "Owner only: a form code to sign the owner up (leave empty to process messages)"
        required: false
        default: ""

permissions:
  contents: write   # to commit the encrypted users file
  actions: write    # to start a first search for a new user

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OWNER_CODE: ${{ github.event.inputs.owner_code }}
        run: |
          if [ -n "$OWNER_CODE" ]; then node bot.js --owner-start "$OWNER_CODE"; else node bot.js; fi
      - name: Save users
        run: |
          git add data/users.enc 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "flight-watch-bot"
          git config user.email "flight-watch-bot@users.noreply.github.com"
          git commit -m "users update"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep $((RANDOM % 10 + 3)); done
          exit 1
      - name: Start searches for new or changed users
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bot.js --start-searches
