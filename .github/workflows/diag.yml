name: diag-kayak

# Manual diagnostic: what does a Kayak search page show from GitHub's machines? Uses a fixed demo route only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: node tools/diag-kayak.js
