name: flight-watch

# Started by cron-job.org (see CRON-SETUP.md) and, as a backup, by GitHub's own schedule.
on:
  schedule:
    - cron: "17 2-22/4 * * *"   # every 4 hours (UTC)
    - cron: "17 19 * * *"    # daily summary backup: 21:17 Israel (winter) / 22:17 (summer); cron-job.org sends it at 21:00
  workflow_dispatch:
    inputs:
      mode:
        description: "check | summary (one a day, evening) | first (new user's first results) | force-summary (test) | test-alert"
        default: "summary"
      user:
        description: "empty = all users · admins = only the admin (for testing; nobody else gets messages) · or one user id"
        default: ""

permissions:
  contents: write   # to commit the encrypted search state

# One full search at a time (cron-job.org and GitHub's own schedule may both start one); a newer waiting run
# replaces an older waiting one. A single user's first search has its own group and is not held up.
concurrency:
  group: flight-watch-${{ (!github.event.inputs.user || github.event.inputs.user == 'admins') && 'all' || github.event.inputs.user }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      users: ${{ steps.list.outputs.users }}
      mode: ${{ steps.list.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: list
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONLY: ${{ github.event.inputs.user }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '17 19 * * *' && 'summary' || 'check') }}
        run: |
          echo "users=$(node lib/list-users.js "$ONLY")" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  search:
    needs: plan
    if: needs.plan.outputs.users != '[]' && needs.plan.outputs.users != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Each entry is a batch of user ids (lib/list-users.js): users with the same route share one job, so their
        # searches share the job's cache, and the job's Google budget (googleMaxPerJob) is split between them.
        batch: ${{ fromJSON(needs.plan.outputs.users) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The runner image already has Chromium's system libraries; --with-deps only adds fonts and can hang.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Tests
        run: npm test

      - name: Search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          CLICK_URL: ${{ secrets.CLICK_URL }}
          CLICK_SECRET: ${{ secrets.CLICK_SECRET }}
          MODE: ${{ needs.plan.outputs.mode }}
          BATCH: ${{ matrix.batch }}
        run: |
          export RUN_CACHE_DIR="$RUNNER_TEMP/run-cache"   # shared by the batch's users; never committed
          export BATCH_SIZE=$(echo $BATCH | wc -w)
          failed=0
          for USER_ID in $BATCH; do
            echo "::group::user $USER_ID"
            case "$MODE" in
              summary)    node watch.js --user "$USER_ID" --summary ;;
              test-alert) TEST_ALERT=1 MAX_PRICE_USD=99999 node watch.js --user "$USER_ID" --summary ;;
              force-summary) FORCE_SUMMARY=1 node watch.js --user "$USER_ID" --summary ;;
              first)      FIRST_SEARCH=1 node watch.js --user "$USER_ID" --summary ;;
              *)          node watch.js --user "$USER_ID" ;;
            esac || failed=1   # one user's crash does not stop the others
            echo "::endgroup::"
          done
          exit $failed

      - name: Save state
        if: always()
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          git config user.name "flight-watch-bot"
          git config user.email "flight-watch-bot@users.noreply.github.com"
          for USER_ID in $BATCH; do f="data/state/$USER_ID.enc"; [ -f "$f" ] && git add "$f"; done
          git add logs/ 2>/dev/null || true   # search log; .gitattributes merges parallel runs line by line
          git diff --cached --quiet && exit 0
          git commit -m "state update"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep $((RANDOM % 10 + 3)); done
          exit 1
