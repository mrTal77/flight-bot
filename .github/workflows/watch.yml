name: flight-watch

on:
  schedule:
    - cron: "17 2-22/4 * * *"   # every 4 hours (UTC)
    - cron: "41 5 * * *"     # daily summary, ~07:41/08:41 Israel time
  workflow_dispatch:
    inputs:
      mode:
        description: "check | summary | test-alert"
        default: "summary"
      user:
        description: "one user id (empty = all users)"
        default: ""

permissions:
  contents: write   # to commit the encrypted search state

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      users: ${{ steps.list.outputs.users }}
      mode: ${{ steps.list.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: list
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ONLY: ${{ github.event.inputs.user }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '41 5 * * *' && 'summary' || 'check') }}
        run: |
          echo "users=$(node lib/list-users.js "$ONLY")" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  search:
    needs: plan
    if: needs.plan.outputs.users != '[]' && needs.plan.outputs.users != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        user: ${{ fromJSON(needs.plan.outputs.users) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The runner image already has Chromium's system libraries; --with-deps only adds fonts and can hang.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Tests
        run: npm test

      - name: Search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
          MODE: ${{ needs.plan.outputs.mode }}
          USER_ID: ${{ matrix.user }}
        run: |
          case "$MODE" in
            summary)    node watch.js --user "$USER_ID" --summary ;;
            test-alert) TEST_ALERT=1 MAX_PRICE_USD=99999 node watch.js --user "$USER_ID" --summary ;;
            *)          node watch.js --user "$USER_ID" ;;
          esac

      - name: Save state
        if: always()
        env:
          USER_ID: ${{ matrix.user }}
        run: |
          f="data/state/$USER_ID.enc"
          [ -f "$f" ] || exit 0
          git config user.name "flight-watch-bot"
          git config user.email "flight-watch-bot@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && exit 0
          git commit -m "state update"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep $((RANDOM % 10 + 3)); done
          exit 1
