<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>דשבורד הבוט</title>
<!-- Owner dashboard. Built only from the public logs in the repository (logs/*.csv): counts and random user ids,
     no names, chat ids, routes, dates or prices. Private numbers (waitlist, blocked users) are in /dashboard in the bot. -->
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #16191f; --muted: #5d6573; --line: #dfe3ea; --bar: #1f6feb; --grid: #eceff4; --bad: #b42318; --good: #1a7f37; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1218; --card: #171b23; --text: #e8ebf0; --muted: #9aa3b2; --line: #2a303b; --bar: #4c8dff; --grid: #222833; --bad: #ff8a80; --good: #5fd38d; } }
  :root[data-theme="dark"] { --bg: #0f1218; --card: #171b23; --text: #e8ebf0; --muted: #9aa3b2; --line: #2a303b; --bar: #4c8dff; --grid: #222833; --bad: #ff8a80; --good: #5fd38d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .bar-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .bar-row button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .bar-row button[aria-pressed="true"] { border-color: var(--bar); color: var(--bar); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile, .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .tile .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .s { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font-size: 10px; }
  .bar { fill: var(--bar); }
  .bar:hover { opacity: .8; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: start; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .ok { color: var(--good); } .bad { color: var(--bad); }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; display: none; z-index: 9; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>📊 דשבורד הבוט</h1>
  <p class="lead">מספרים מתוך היומנים הציבוריים במאגר (בלי שמות, מסלולים או מחירים). רשימת ההמתנה והחסומים מופיעים רק ב-<code>/dashboard</code> בבוט.</p>
  <div class="bar-row" id="range">
    <button type="button" data-d="7">7 ימים</button><button type="button" data-d="14" aria-pressed="true">14 ימים</button><button type="button" data-d="30">30 ימים</button>
    <span id="status" class="lead" style="margin:0"></span>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="grid" id="charts"></div>
  <div class="card" style="margin-top:10px"><h2>חיפושים לפי מקור</h2><table id="sources"></table></div>
</main>
<div class="tip" id="tip"></div>
<script>
(function () {
  'use strict';
  var REPO = 'mrTal77/flight-bot';
  var RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/logs/';
  var $ = function (id) { return document.getElementById(id); };
  var days = 14; var data = {};

  function parseCsv(text) {
    var lines = text.split('\n').filter(Boolean); if (!lines.length) return [];
    var head = lines[0].split(',');
    return lines.slice(1).filter(function (l) { return /^\d/.test(l); }).map(  // skips repeated or older header lines
      function (line) {
      var out = []; var cur = ''; var q = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
        else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch;
      }
      out.push(cur); var o = {}; head.forEach(function (h, j) { o[h] = out[j]; }); return o;
    });
  }
  function load(name) {
    return fetch(RAW + name + '?t=' + Date.now()).then(function (r) { return r.ok ? r.text() : ''; }).then(parseCsv).catch(function () { return []; });
  }
  function dayList() { var out = []; var now = Date.now(); for (var i = days - 1; i >= 0; i--) out.push(new Date(now - i * 864e5).toISOString().slice(0, 10)); return out; }
  function perDay(rows, key, filter, uniq) {
    var m = {}; rows.forEach(function (r) {
      var d = (r[key] || '').slice(0, 10); if (!filter || filter(r)) { if (uniq) { m[d] = m[d] || {}; m[d][uniq(r)] = 1; } else m[d] = (m[d] || 0) + (r._n || 1); }
    });
    return dayList().map(function (d) { var v = m[d]; return [d, uniq ? (v ? Object.keys(v).length : 0) : (v || 0)]; });
  }
  var tip = $('tip');
  function showTip(e, text) { tip.textContent = text; tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 28) + 'px'; }
  function chart(title, series, unit) {
    var W = 320, H = 140, padB = 18, padT = 14; var max = Math.max.apply(null, series.map(function (s) { return s[1]; }).concat([1]));
    var bw = W / series.length; var step = Math.max(1, Math.ceil(series.length / 7));
    var svg = '<svg dir="ltr" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + title + '">';
    svg += '<line x1="0" x2="' + W + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '" stroke="var(--line)"/>';
    svg += '<text x="' + W + '" y="10" text-anchor="end">' + max + '</text><line x1="0" x2="' + W + '" y1="' + padT + '" y2="' + padT + '" stroke="var(--grid)"/>';
    series.forEach(function (s, i) {
      var h = s[1] ? Math.max(2, (H - padB - padT) * s[1] / max) : 0; var x = i * bw + Math.max(1, bw * 0.15); var w = Math.max(2, bw * 0.7);
      // the hit target is the whole column, wider than the bar
      svg += '<g data-tip="' + s[0].slice(8) + '.' + Number(s[0].slice(5, 7)) + ': ' + s[1] + (unit || '') + '"><rect x="' + i * bw + '" y="0" width="' + bw + '" height="' + (H - padB) + '" fill="transparent"/>';
      if (h) svg += '<rect class="bar" x="' + x + '" y="' + (H - padB - h) + '" width="' + w + '" height="' + h + '" rx="2"/>';
      svg += '</g>';
      if (i % step === 0) svg += '<text x="' + (i * bw + bw / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + Number(s[0].slice(8)) + '.' + Number(s[0].slice(5, 7)) + '</text>';
    });
    svg += '</svg>';
    var total = series.reduce(function (a, s) { return a + s[1]; }, 0);
    return '<div class="card"><h2>' + title + ' <span class="lead" style="font-weight:400">· סה״כ ' + total + '</span></h2>' + svg + '</div>';
  }
  function tile(k, v, s) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>'; }

  function render() {
    var since = dayList()[0];
    var runs = data.runs.filter(function (r) { return r.time_utc >= since; });
    var msgs = data.messages.filter(function (m) { return m.time_utc >= since && m.status === 'sent'; });
    var clicks = data.clicks.filter(function (c) { return c.date >= since; }).map(function (c) { c._n = Number(c.clicks) || 0; return c; });
    var users = {}; runs.forEach(function (r) { users[r.user] = 1; });
    var count = function (t) { return msgs.filter(function (m) { return m.type === t; }).length; };
    var crashes = runs.filter(function (r) { return /^crash/.test(r.outcome || ''); }).length;
    var avg = runs.length ? Math.round(runs.reduce(function (a, r) { return a + Number(r.seconds || 0); }, 0) / runs.length) : 0;
    $('tiles').innerHTML = [
      tile('משתמשים פעילים', Object.keys(users).length, 'שהיה להם חיפוש בתקופה'),
      tile('נרשמו', count('signup') + count('admitted'), count('admitted') ? count('admitted') + ' מרשימת ההמתנה' : ''),
      tile('נכנסו לרשימת המתנה', count('waitlist'), ''),
      tile('התראות', count('alert'), 'סיכומים: ' + count('summary')),
      tile('לחיצות על קישורים', clicks.reduce(function (a, c) { return a + c._n; }, 0), data.clicks.length ? '' : 'מונה הלחיצות לא מופעל'),
      tile('ריצות חיפוש', runs.length, 'ממוצע ' + avg + ' שנ׳' + (crashes ? ' · ' + crashes + ' קרסו' : '')),
    ].join('');
    $('charts').innerHTML = [
      chart('משתמשים פעילים ביום', perDay(runs, 'time_utc', null, function (r) { return r.user; })),
      chart('הרשמות ביום', perDay(msgs, 'time_utc', function (m) { return m.type === 'signup' || m.type === 'admitted'; })),
      chart('כניסות לרשימת ההמתנה ביום', perDay(msgs, 'time_utc', function (m) { return m.type === 'waitlist'; })),
      chart('התראות וסיכומים ביום', perDay(msgs, 'time_utc', function (m) { return m.type === 'alert' || m.type === 'summary'; })),
      chart('ריצות חיפוש ביום', perDay(runs, 'time_utc')),
      chart('לחיצות על קישורים ביום', perDay(clicks, 'date')),
    ].join('');
    var rows = ['kayak', 'kiwi', 'google'].map(function (s) {
      var n = function (k) { return runs.reduce(function (a, r) { return a + Number(r[s + '_' + k] || 0); }, 0); };
      var ok = n('ok'), f = n('failed'), b = n('blocked'), sk = n('skipped'); var all = ok + f + b;
      return '<tr><td>' + s + '</td><td class="ok">' + ok + '</td><td class="bad">' + f + '</td><td class="bad">' + b + '</td><td>' + sk + '</td><td>' + (all ? Math.round(100 * ok / all) + '%' : '—') + '</td></tr>';
    });
    $('sources').innerHTML = '<tr><th>מקור</th><th>הצליחו</th><th>נכשלו</th><th>נחסמו</th><th>דולגו</th><th>הצלחה</th></tr>' + rows.join('');
  }

  document.addEventListener('mousemove', function (e) { var g = e.target.closest && e.target.closest('[data-tip]'); if (g) showTip(e, g.getAttribute('data-tip')); else tip.style.display = 'none'; });
  $('range').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; days = Number(b.dataset.d);
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    render();
  });
  $('status').textContent = 'טוען…';
  Promise.all(['runs.csv', 'messages.csv', 'clicks.csv'].map(load)).then(function (r) {
    data = { runs: r[0], messages: r[1], clicks: r[2] };
    $('status').textContent = r[0].length ? 'עודכן עכשיו מהמאגר' : 'לא הצלחתי לקרוא את היומנים';
    if (!r[0].length) $('status').className = 'err';
    render();
  });
}());
</script>
</body>
</html>
